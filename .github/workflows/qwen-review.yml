name: Qwen Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled, assigned]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qwen:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@qwencoder')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@qwencoder')) ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'qwen')) ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: QwenLM/qwen-code-action@main
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
